# osv-scanner's ignore list, read by CI's `supply-chain` job (#208, security-audit 2026-09-22).
#
# The job fails on every known advisory in package-lock.json that is NOT listed here. An entry is
# an advisory we know about and have not fixed yet, and every entry must carry:
#
#   id           the advisory, as osv.dev names it
#   ignoreUntil  the day the ignore lapses. After it, osv-scanner counts the advisory again and the
#                job goes red, so nothing stays ignored by being forgotten
#   reason       what fixes it and where that fix is
#
# test/supply-chain.test.ts refuses an entry missing any of the three. To clear one, land the fix
# and delete the entry. To extend one, change the date and say why in the reason.
#
# Recorded 2026-11-11, when the job was added: these 21 were already in the lockfile on develop,
# and the owner chose two-week dated ignores over holding the job for the fixes. Four of the six
# packages have a Dependabot PR open.

