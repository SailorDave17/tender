version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A version is not pulled until it has been on the registry for a week. The npm worm lineage
    # (Shai-Hulud and its 2026 successors) spreads through freshly published versions and is
    # usually yanked within days; a floor on age is the cheapest defence there is. Version updates
    # only - GitHub applies no cooldown to security updates, which is the intended asymmetry.
    cooldown:
      default-days: 7
    # Two majors are blocked by upstream, not by anything in this repo. Without these
    # rules, closing a PR only suppresses that exact version — the next patch of the
    # same major (7.0.3, 10.8.2) opens a fresh PR that fails identically. Minors and
    # patches, including security advisories, keep flowing for both.
    ignore:
      # typescript-eslint@8.67.0 (latest, 2026-08-22) peers `typescript >=4.8.4 <6.1.0`
      # and refuses TS 7 by name: "typescript-eslint does not support TS 7.0", pointing
      # at typescript-eslint#10940. Measured on PR #6: `npm run lint` fails, everything
      # else passes. Lift when typescript-eslint supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react@7.37.5 (latest, 2026-08-22) peers `eslint ^3 || … || ^9.7`
      # — there is no ESLint 10-compatible release — and it reaches us through
      # eslint-config-next@16.3.2. Measured on PR #5: `npm run lint` dies with
      # "TypeError: contextOrFilename.getFilename is not a function". Lift when
      # eslint-config-next ships a plugin tree that supports ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Not blocked upstream — a policy pin. @types/node describes the runtime, and this
      # repo runs Node 24 (.nvmrc, `engines: >=24`, `"@types/node": "^24"`). Types for a
      # newer major let tsc accept code that crashes on 24, which CI cannot catch until
      # something actually calls such an API. Measured on PR #4 (closed): it passed CI.
      # Lift when .nvmrc moves off Node 24, and move it in the same commit.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # react and react-dom ship in lockstep and peer each other exactly:
    # react-dom@19.3.0 peers `react@^19.3.0`, so a PR that moves one without the
    # other writes a lockfile npm refuses. Measured on PR #168: react-dom went to
    # 19.3.0 with react left at 19.2.8 and `npm ci` died with ERESOLVE before a
    # single test ran. Ungrouped, this splits on every react release, not once.
    # The @types packages are grouped with them because @types/react-dom@19.3.0
    # requires @types/react@^19.3.0 for the same reason.
    # Two entries because a group covers one of applies-to version-updates or
    # security-updates, never both, and an advisory on react-dom would split
    # identically.
    groups:
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      react-security:
        applies-to: security-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The workflows pin actions by commit SHA (security-audit 2026-09-22); Dependabot moves the SHA
    # and keeps the `# vN` comment current. Same age floor as npm, for the same reason.
    cooldown:
      default-days: 7
